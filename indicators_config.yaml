# Indicators configuration — 全量版
#
# 列命名:
#   <category>_<name>_<param_slug>           单输出
#   <category>_<name>_<param_slug>_<output>  多输出

# 头部原来写死的「221 列」早已过期(加 6 个 zettaranc 适配列后实际 231,
# 本轮再 +13 列)。现在列数由 schema/indicators_schema.py 的 expand_columns()
# 从本文件推导,不要再往这里写死数字 —— 要查列数就跑 expand_columns。
#
# 2026-09-30 评估过但本轮没加的两个候选(留着,免得下次重新调研):
#   * MAVP 变周期均线 —— TA-Lib 的 periods 是逐 bar 数组而非标量,现有
#     params: [...] 表达不了,需要先定一条周期生成规则(属策略参数决策)。
#   * VP 成交量分布 —— ta.vp(close, volume) 返回 10 档分布快照 DataFrame,
#     不是逐日序列,无法像其他指标一样摊平成宽表的列。真要加得先定义
#     「取哪几个字段、怎么聚合成日频」。
#   * SAREXT 扩展抛物线 —— 实测本 build 的 talib.SAREXT 输出会发散:
#     600519.SH(价格 1151~1772)上 50%+ 取值为负、末值 -1301,且对 startValue
#     取 0.02/0/首收盘价 三种变体结果一致,不是参数语义问题。同题的
#     calc_psar(talib.SAR)末值 1277、零负值正常。相对 PSAR 的增量只是
#     「多空两侧用不同加速上限」,不值得冒往 16GB 宽表写脏数据的风险。
#   * KST 库普考克 —— 实测值域比标准定义大 100 倍(茅台手工复算 [-96.8,138.0]
#     vs 库 [-9684.7,13804.4],重叠段最大绝对差 13666);同一指标在不同价位个股上
#     的「KST/价格量级」从 10x 跳到 1951x,不是干净的缩放误差。
#   * EFI 效率因子 —— 库输出 ±5.45e8,按定义 (C-C_prev)/V*10000 手算只有 ±0.13,
#     差约 4e9。
#   * CG 钱得 Kroll 通道 —— 值域 [-5.63,-5.15]、666 根里 657 个不同值,而同期
#     价格在 1237~1259 波动:通道与价格完全无关,是坏的。
#   * RVGI 相对成交量指数 —— 与定义式手工复算偏差 89.9%,且无法确认本 fork
#     用的确切归一化方式;无法验证就不进表。
#
# 教训:第二批 30 个候选里有 7 个(23%)是坏的,而且全都表现为「能算、不报错、
# 值域离谱」。所以任何新指标进表前都要手工复算一遍定义,不能只看函数存在。

