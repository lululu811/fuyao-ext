    backend: pandas_ta
    enabled: true
  drawdown:
    # 回撤三件套:绝对值 / 比例 / 对数。策略层算风险敞口直接用这三列
    #
    # 中间那列 2026-10-01 由 `pct` 改名 `frac`:ta.drawdown 返回的 DD_PCT 是
    # 0~1 的**比例**(实测全库 max=0.978,即 97.8% 回撤存成 0.978),不是百分数。
    # 列名带 _pct 会让人按"回撤>20"这种百分数口径写阈值,于是永不触发。
    # 与 momentum_bias_14(比值)一致,这里统一用 frac 表明是比例。
    params: [20]
    backend: pandas_ta
    enabled: true
    outputs: [dd, frac, log]

