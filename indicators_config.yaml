volatility:
  bbands:
    params: [[20, 2.0], [10, 1.5]]
    backend: talib
    enabled: true
    outputs: [upper, middle, lower]
  atr:
    params: [14]
    backend: talib
    enabled: true
  natr:
    params: [14]
    backend: talib
    enabled: true
  donchian:
    params: [20]
    backend: talib
    enabled: true
    outputs: [upper, middle, lower]
  kc:
    params: [[20, 2]]
    backend: pandas_ta
    enabled: true
    # 顺序必须与 pandas_ta_classic.kc() 的返回列顺序一致：
    # KCLe_20_2.0, KCBe_20_2.0, KCUe_20_2.0 = lower, middle, upper。
    # adapter_pandas_ta.calc_kc 虽按角色名建字典，最后仍按本列表重排
    # (ordered -> _df_rename_cols)，所以这里写成 [upper, middle, lower]
    # 会让 upper 列拿到 lower 的值 —— 2026-10-01 实测全库 100% 的行
    # kc_upper < kc_lower，两列互换，直接导致 Keltner 挤压信号永不触发
    # (signal_frequency_audit.md 记为 dead)。
    outputs: [lower, middle, upper]
  trange:
    params: [{}]
    backend: talib
    enabled: true
  vhf:
    # 垂直水平过滤:(H+L)/2 的纵向跨度 / 横向跨度,有界 [0,1],
    # 接近 1 = 趋势性强。adapter 里传的是 (H+L)/2 而不是收盘价
    params: [14]
    backend: talib
    enabled: true

