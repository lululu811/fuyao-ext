zettaranc:
  # 白线 Z哥: EMA(EMA(CLOSE,10),10) — 短期趋势线、牵牛绳
  zg_white:
    params: [10]
    backend: pandas_ta
    enabled: true
  # 黄线 大哥线: (MA14+MA28+MA57+MA114)/4 — 主力成本线、极限洗盘极限位
  dg_yellow:
    params: [14]
    backend: pandas_ta
    enabled: true
  # BBI 多空线: (MA3+MA6+MA12+MA24)/4 — 少妇战法 1.0 核心
  bbi:
    params: [{}]
    backend: pandas_ta
    enabled: true
  # 砖型图 brick_value: (close - open) / (high - low) — Delta 理论变体,A 股 4 天情绪循环
  brick_value:
    params: [{}]
    backend: pandas_ta
    enabled: true
  # ⚠️ RSL 不在本 config 中。
  #
  # RSL（N 日涨幅在滚动窗口内的百分位排名）由 scripts/add_zettaranc_columns.py
  # 负责，产出 zettaranc_rsl_rank_15 / _rank_105。这两列是**线上表里实际存在的**。
  #
  # 本类目此前还有 rsl_short:[3] / rsl_long:[21] 两条，经与线上表比对确认
  # **从未被应用**（线上表有 _rank_15/_rank_105，无 _short_3/_long_21），
  # 且两者公式等价 —— 保留只会让 add_indicators.py 回填出两列重复的 RSL。已移除。
  #
  # 无法直接改用 config 驱动的原因：config 的列名由单一 params 推导
  # (_make_col_prefix)，而 RSL 需要两组数字 —— pct_change 回看周期(3/21)
  # 与排名窗口(15/105) 不相等。
