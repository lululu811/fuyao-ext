[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fuyao-ext"
version = "0.1.0"
description = "A股本地数据仓库的数据契约、采集抽象与指标引擎。不分发任何数据。"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"

# 依赖清单从实际 import 扫描得出（a-stock 自有代码，排除 vendored 目录）：
#   talib           <- adapter/adapter_talib.py
#   pandas_ta_classic <- adapter/adapter_pandas_ta.py, scripts/{fix_kc,add_zettaranc}_columns.py
#   duckdb          <- adapter/loader.py, scripts/*.py
#   yaml            <- schema/indicators_schema.py, adapter/compute.py
#   pandas / numpy  <- 全部计算路径
#
# 开发环境实测版本（Apple Silicon / macOS）：
#   Python 3.14.7 · pandas 3.0.5 · numpy 2.5.3 · duckdb 1.5.5
#   ta-lib 0.8.0 · pandas-ta-classic 0.8.33.dev63 · PyYAML 6.0.3
dependencies = [
    "duckdb>=1.0",
    "pandas>=2.0",
    "numpy>=1.26",
    "PyYAML>=6.0",
    "ta-lib>=0.6",
    "pandas-ta-classic>=0.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.5",
]

# ---------------------------------------------------------------------------
# NOTE: 下列 package 声明对应 Phase 1 迁入的代码。
# schema/ 现有 indicators_schema.py 的上游版本没有 __init__.py，
# 依赖 Python 3.3+ 的隐式 namespace package 才能 import；正式发布时需显式补上。
# ---------------------------------------------------------------------------
[tool.setuptools]
packages = ["adapter", "schema", "ingestors", "ingestors.fuyao"]

[tool.setuptools.package-data]
schema = ["*.sql"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# 沿用上游既有风格：大量脚本用 sys.path.insert 后再 import 本地包
select = ["E", "F", "W", "I"]
ignore = ["E402"]  # module level import not at top of file

[tool.pytest.ini_options]
testpaths = ["tests"]
