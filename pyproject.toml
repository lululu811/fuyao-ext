[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fuyao-ext"
version = "0.1.0"
description = "A股本地数据仓库的数据契约、采集抽象与指标引擎。不分发任何数据。"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"

# ---------------------------------------------------------------------------
# 依赖清单从实际 import 扫描得出（原 a-stock 仓无任何依赖声明，依赖是靠
# sys.path 注入仓库内的本地目录解析的 —— 那套隐式路径注入已全部移除）：
#   talib            <- indicator/adapter_talib.py
#   pandas_ta_classic<- indicator/adapter_pandas_ta.py, scripts/{fix_kc,add_zettaranc}_columns.py
#   duckdb           <- indicator/loader.py, scripts/*.py
#   yaml             <- schema/indicators_schema.py, indicator/compute.py
#   pandas / numpy   <- 全部计算路径
#
# 开发环境实测版本（Apple Silicon / macOS）：
#   Python 3.14.7 · pandas 3.0.5 · numpy 2.5.3 · duckdb 1.5.5
#   ta-lib 0.8.0 · pandas-ta-classic 0.8.33.dev63 · PyYAML 6.0.3
# ---------------------------------------------------------------------------
dependencies = [
    "duckdb>=1.0",
    "pandas>=2.0",
    "numpy>=1.26",
    "PyYAML>=6.0",
    "ta-lib>=0.6",
    "pandas-ta-classic>=0.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.5",
]

[tool.setuptools]
packages = ["indicator", "schema", "ingestors", "ingestors.fuyao"]
py-modules = ["paths"]

[tool.setuptools.package-data]
schema = ["*.sql"]

[tool.ruff]
# 迁入代码中最长行为 131 字符（多为进度打印与数据类名列表）。
# 不做全量重排版以免在数值计算代码中引入风险，仅对新增代码从紧。
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
